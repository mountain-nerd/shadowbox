# Shadow gateway: receives mirrored copies as its own primary traffic.
# shadowbox rewrites each copy into the candidate variant (fail-closed) and
# captures the candidate's answer.
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9902 } }
static_resources:
  listeners:
  - name: shadow
    address: { socket_address: { address: 0.0.0.0, port_value: 10001 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: shadow
          preserve_external_request_id: true   # keep the prod x-request-id: it is the pairing key
          route_config:
            virtual_hosts:
            - name: candidate
              domains: ["*"]
              routes:
              - match: { prefix: "/v1/chat/completions" }
                route: { cluster: candidate_llm, timeout: 30s }
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc: { cluster_name: shadowbox }
                timeout: 2s
                initial_metadata:
                - { key: x-shadowbox-token, value: e2e-stream-secret }   # shared secret; use mTLS or a mounted secret in production
                - { key: x-shadowbox-role, value: shadow }
                - { key: x-shadowbox-experiment, value: support-v2 }
              failure_mode_allow: false   # never send an un-rewritten copy to the candidate
              processing_mode:
                request_header_mode: SEND
                request_body_mode: BUFFERED
                response_header_mode: SEND
                response_body_mode: BUFFERED
                request_trailer_mode: SKIP
                response_trailer_mode: SKIP
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: candidate_llm
    type: STRICT_DNS
    load_assignment:
      cluster_name: candidate_llm
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: candidate-llm, port_value: 8080 } } } }] }]
  - name: shadowbox
    type: STRICT_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: shadowbox
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: shadowbox, port_value: 9000 } } } }] }]
