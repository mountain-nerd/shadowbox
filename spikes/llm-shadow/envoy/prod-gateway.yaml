# Production gateway: routes LLM calls to the current model and mirrors a
# fraction of them (fire-and-forget) to the shadow gateway. Only standard
# Envoy route features are used (RouteAction.request_mirror_policies).
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }

# Admin runtime layer so the mirror percentage can be changed live via /runtime_modify.
layered_runtime:
  layers:
  - name: static
    static_layer: {}
  - name: admin
    admin_layer: {}

static_resources:
  listeners:
  - name: llm
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: prod
          route_config:
            virtual_hosts:
            - name: llm
              domains: ["*"]
              routes:
              - match: { prefix: "/v1/chat/completions" }
                route:
                  cluster: primary_llm
                  timeout: 30s
                  request_mirror_policies:
                  - cluster: shadow_gateway
                    # Sampling. Change live: curl -XPOST 'localhost:9901/runtime_modify?shadow.llm_percent=20'
                    runtime_fraction:
                      default_value: { numerator: 100, denominator: HUNDRED }
                      runtime_key: shadow.llm_percent
                    # Applied to the mirrored copy only.
                    request_headers_mutations:
                    - append:
                        header: { key: x-agentmesh-shadow, value: exp-support-v2 }
                        append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - remove: authorization   # shadow gateway uses its own credentials
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: primary_llm
    type: STRICT_DNS
    load_assignment:
      cluster_name: primary_llm
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: primary-llm, port_value: 8080 } } } }] }]
  - name: shadow_gateway
    type: STRICT_DNS
    load_assignment:
      cluster_name: shadow_gateway
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: shadow-gateway, port_value: 10001 } } } }] }]
