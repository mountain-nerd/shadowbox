# Shadow gateway: receives the identical mirrored copy as its *own* primary
# traffic, so its filter chain runs normally. ext_proc (prompt-swap) turns the
# request into the candidate variant; a local rate limit caps the experiment.
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9902 } }

static_resources:
  listeners:
  - name: shadow
    address: { socket_address: { address: 0.0.0.0, port_value: 10001 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: shadow
          route_config:
            virtual_hosts:
            - name: candidate
              domains: ["*"]
              routes:
              - match: { prefix: "/v1/chat/completions" }
                route: { cluster: candidate_llm, timeout: 30s }
          http_filters:
          # Experiment budget (request-based here; token budgets need an AI-aware gateway).
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: shadow_budget
              token_bucket: { max_tokens: 100, tokens_per_fill: 100, fill_interval: 60s }
              filter_enabled: { default_value: { numerator: 100, denominator: HUNDRED } }
              filter_enforced: { default_value: { numerator: 100, denominator: HUNDRED } }
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service: { envoy_grpc: { cluster_name: prompt_swap }, timeout: 2s }
              failure_mode_allow: false   # fail closed: never send an un-rewritten copy to the candidate
              processing_mode:
                request_header_mode: SEND
                request_body_mode: BUFFERED
                response_header_mode: SKIP
                response_body_mode: NONE
                request_trailer_mode: SKIP
                response_trailer_mode: SKIP
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: candidate_llm
    type: STRICT_DNS
    load_assignment:
      cluster_name: candidate_llm
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: candidate-llm, port_value: 8080 } } } }] }]
  - name: prompt_swap
    type: STRICT_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: prompt_swap
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: prompt-swap, port_value: 9000 } } } }] }]
